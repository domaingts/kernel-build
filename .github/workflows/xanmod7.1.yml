# This is a basic workflow to help you get started with Actions

name: Kernel Build - Xanmod 7.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xanmod-7.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DEB_BUILD_OPTIONS: nocheck
      KERNEL_LOCALVERSION: -cloud

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 最大化可用空间
        run: |
          echo "-- Dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "-- Android"
          sudo rm -rf /usr/local/lib/android
          echo "-- Haskell"
          sudo rm -rf /opt/ghc
          echo "-- CodeQL"
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          df -h

      - name: 显示系统信息 & 设置时区
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo
          cat /proc/meminfo
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 安装 LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "PATH=/usr/lib/llvm-21/bin:$PATH" >> $GITHUB_ENV

      - name: 安装依赖 dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-mark hold grub-efi-amd64-signed firefox snapd mysql* || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo -E apt-get -y update
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            libdw-dev debhelper debhelper-compat dpkg-dev devscripts \
            linux-libc-dev linux-firmware curl wget \
            dwarves pahole fakeroot git pkg-config perl \
            rsync xz-utils zstd binutils cpio initramfs-tools
          sudo -E systemctl daemon-reload || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean

      - name: 下载 XanMod 内核
        run: |
          git clone --depth=1 --branch 7.1 https://gitlab.com/xanmod/linux.git kernel

      - name: 从仓库更新 config 配置
        run: |
          set -euo pipefail
          cd kernel
          cp ../config.sh .
          chmod +x config.sh
          cp CONFIGS/x86_64/config .config
          ./config.sh
          # 7.1 vDSO 不再从 32 位目标里去掉 64 位 -march，直接关掉 IA32 vDSO。
          scripts/config --disable CONFIG_IA32_EMULATION
          scripts/config --disable CONFIG_X86_X32_ABI
          scripts/config --disable CONFIG_COMPAT_32 || true
          scripts/config --disable CONFIG_COMPAT || true
          make LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld olddefconfig
          echo "::group::compat options after olddefconfig"
          grep -E 'CONFIG_(IA32_EMULATION|X86_X32_ABI|COMPAT_32|COMPAT)[= ]' .config || true
          echo "::endgroup::"
          if grep -qE '^CONFIG_(IA32_EMULATION|COMPAT_32|X86_X32_ABI)=y' .config; then
            echo "::error::32-bit compat still enabled; Clang vdso32 will fail"
            exit 1
          fi

      - name: 导出最终内核配置 .config
        run: |
          mkdir -p artifacts
          cp kernel/.config artifacts/config-7.1-clang-${{ github.run_id }}

      - name: 构建内核软件包 kernel deb packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          build_log=bindeb-pkg.log
          if ! make -C kernel -j"$(nproc)" \
            LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            KDEB_COMPRESS=xz \
            LOCALVERSION="${KERNEL_LOCALVERSION}" \
            KCFLAGS="-O3 -Wno-error" \
            bindeb-pkg > "${build_log}" 2>&1; then
            cp "${build_log}" artifacts/bindeb-pkg.log
            echo "::group::Filtered error lines"
            if ! grep -nE 'error:|fatal:|undefined reference|No rule to make target|Error [0-9]+' "${build_log}" | head -n 100; then
              echo "No filtered error lines matched. Showing last 80 log lines instead."
              tail -n 80 "${build_log}" || true
            fi
            echo "::endgroup::"
            echo "Full build log saved to artifacts/bindeb-pkg.log"
            exit 1
          fi
          rm -f "${build_log}"
          echo "bindeb-pkg completed successfully"

      - name: 归档文件 kernel artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find . -maxdepth 1 -type f \
            \( -name 'linux-image-*.deb' -o -name 'linux-headers-*.deb' \) \
            -exec mv -t artifacts {} +
          ls -lh artifacts

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-cloud-7.1-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: 发布
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xanmod-cloud-7.1-${{ github.run_id }}
          name: XanMod Cloud 内核 v3
          files: artifacts/*
          overwrite_files: true
